<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Student Dashboard - Hostel DBMS</title>
  <<link rel="stylesheet" href="./styles/styles.css"/>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand">Student Portal</h1>
      <div><button id="logout" class="btn btn-outline">Logout</button></div>
    </div>
  </header>

  <main class="container">
    <div id="studentCard" class="card-plain"></div>

    <div class="card-row" style="margin-top:20px;">
      <a class="card" href="leave-student.html">Apply Leave</a>
      <a class="card" href="maintenance-student.html">Maintenance</a>
      <a class="card" href="notices-student.html">Notices</a>
    </div>
  </main>

  <script src="./js/frontend.js"></script>
  <script>
    const data = JSON.parse(localStorage.getItem('studentData') || 'null');
    if (!data) location.href = 'student-login.html';
    const card = document.getElementById('studentCard');
    card.innerHTML = `
      <h3>${data.name || 'Student'}</h3>
      <p><strong>ID:</strong> ${data.student_id}</p>
      <p><strong>Hostel:</strong> ${data.hostel_name || 'Pending'}</p>
      <p><strong>Room:</strong> ${data.room_number || 'Pending'}</p>
      <p><strong>Phone:</strong> ${data.phone || ''}</p>
    `;
    document.getElementById('logout').addEventListener('click', ()=>{
      localStorage.removeItem('studentData');
      location.href = 'student-login.html';
    });
  </script>
</body>
</html>
