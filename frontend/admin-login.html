<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login - Hostel DBMS</title>
  <link rel="stylesheet" href="./styles/styles.css"/>
</head>
<body>
  <main class="container center-card">
    <div class="auth-card">
      <h2>Admin Login</h2>
      <form id="adminLoginForm">
        <label>Username
          <input id="username" name="username" required />
        </label>
        <label>Password
          <input id="password" name="password" type="password" required />
        </label>
        <div class="row gap">
          <button type="submit" class="btn">Login</button>
          <a href="index.html" class="btn btn-outline">Back</a>
        </div>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </main>

   <script src="./js/frontend.js"></script>
  
  <script>
    const form = document.getElementById('adminLoginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const res = await apiPost('/api/admin/login', { username, password });
      if (res && res.token) {
        localStorage.setItem('adminToken', res.token);
        location.href = 'admin-dashboard.html';
      } else {
        showMsg('msg', res?.message || 'Login failed', true);
      }
    });
  </script>
</body>
</html>
