<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Student Registration - Hostel DBMS</title>
  <link rel="stylesheet" href="./styles/styles.css"/>
</head>
<body>
  <main class="container center-card">
    <div class="auth-card">
      <h2>Student Registration</h2>
      <form id="studentRegister">
        <label>Full Name
          <input name="name" required />
        </label>
        <label>Roll Number (Student ID)
          <input name="student_id" required />
        </label>
        <label>Parent's Name
          <input name="parent_name" />
        </label>
        <label>Phone
          <input name="phone" />
        </label>
        <label>Email
          <input name="email" type="email" />
        </label>
        <label>Branch
          <input name="branch" />
        </label>
        <label>Year
          <input name="year" type="number" min="1" max="10" />
        </label>
        <label>Create Password
          <input name="password" type="password" required />
        </label>

        <div class="row gap">
          <button class="btn" type="submit">Register</button>
          <a class="btn btn-outline" href="index.html">Back</a>
        </div>
      </form>
      <div id="regMsg" class="msg"></div>
    </div>
  </main>

<script src="./js/frontend.js"></script>
  <script>
    document.getElementById('studentRegister').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      // call API - ensure backend route exists: POST /api/students/register
      const res = await apiPost('/api/students/register', data);
      if (res && res.success) {
        showMsg('regMsg', 'Registered. Please login.', false);
        e.target.reset();
        setTimeout(()=> location.href='student-login.html', 1000);
      } else {
        showMsg('regMsg', res?.error || 'Registration failed', true);
      }
    });
  </script>
</body>
</html>
