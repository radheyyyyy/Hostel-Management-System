<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin — Maintenance Requests</title>
  <link rel="stylesheet" href="./styles/styles.css"/>
</head>
<body>
  <main class="container">
    <h2>Admin — Maintenance Requests</h2>
    <div id="msg" class="msg" style="display:none;"></div>

    <table id="maintTable">
      <thead><tr><th>ID</th><th>Student ID</th><th>Name</th><th>Hostel</th><th>Room</th><th>Category</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="./js/frontend.js"></script>
 
  <script>
    async function loadMaintenance() {
      const res = await apiGet('/api/maintenance');
      const rows = res?.tickets || [];
      const tbody = document.querySelector('#maintTable tbody');
      tbody.innerHTML = '';
      for (const m of rows) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${m.id}</td>
                        <td>${m.student_id}</td>
                        <td>${m.student_name || ''}</td>
                        <td>${m.hostel_name || ''}</td>
                        <td>${m.room_number || ''}</td>
                        <td>${m.category}</td>
                        <td>${m.description}</td>
                        <td>${m.status}</td>
                        <td>
                          <button class="start" data-id="${m.id}">In Progress</button>
                          <button class="close" data-id="${m.id}">Close</button>
                        </td>`;
        tbody.appendChild(tr);
      }

      document.querySelectorAll('button.start').forEach(b=>{
        b.onclick = async ()=> {
          const id = b.dataset.id;
          await apiPut(`/api/maintenance/${encodeURIComponent(id)}/status`, { status: 'in_progress' });
          loadMaintenance();
        };
      });
      document.querySelectorAll('button.close').forEach(b=>{
        b.onclick = async ()=> {
          const id = b.dataset.id;
          await apiPut(`/api/maintenance/${encodeURIComponent(id)}/status`, { status: 'closed' });
          loadMaintenance();
        };
      });
    }

    loadMaintenance();
  </script>
</body>
</html>
